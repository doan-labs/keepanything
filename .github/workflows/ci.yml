name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the Swift version the macos-26 runner reports (docs/swift_rewrite/PLAN.md#toolchain).
  SWIFT_VERSION: "6.3.3"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils libcurl4-openssl-dev libxml2-dev libsqlite3-dev zlib1g-dev libstdc++-13-dev pkg-config
          curl -fsSL "https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2404/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE-ubuntu24.04.tar.gz" | sudo tar -xz -C /opt
          echo "/opt/swift-$SWIFT_VERSION-RELEASE-ubuntu24.04/usr/bin" >> "$GITHUB_PATH"
      - run: swift --version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: electron/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: electron/.nvmrc
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - name: Allow Linux optional deps
        # pnpm-workspace.yaml pins supportedArchitectures to darwin (for dual-arch Mac packaging);
        # on Linux that skips all linux-* optional packages (e.g. @rollup/rollup-linux-x64-gnu).
        run: sed -i '/^supportedArchitectures:/,$d' electron/pnpm-workspace.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: electron

      - run: bash scripts/gate.sh lint
      - run: bash scripts/gate.sh linux

  macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app && swift --version

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: electron/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: electron/.nvmrc
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: electron

      - run: bash scripts/gate.sh lint
      - run: bash scripts/gate.sh macos
